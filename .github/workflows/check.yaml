name: Check configuration
on:
  pull_request:
  push:
    branches: [main, refactor/flake.parts]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Evaluate all three hosts and both Home Manager configurations
        run: nix flake check --all-systems --no-build
